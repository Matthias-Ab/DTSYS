events {
    worker_connections 1024;
}

http {
    server_tokens off;

    # Docker's embedded DNS. Upstreams are referenced through variables so nginx
    # re-resolves them (valid=10s). A static `upstream {}` block resolves once at
    # startup and returns 502 forever after a container is recreated (every
    # `docker compose up -d` redeploy) until nginx is restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    limit_req_zone $binary_remote_addr zone=api_rate:10m rate=10r/s;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript application/xml;
    gzip_min_length 1024;

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Security headers for everything nginx serves (SPA included). Declared at
        # server level only: an add_header inside a location would drop these.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        # nginx is the edge: OVERWRITE X-Forwarded-For with the real peer address so
        # clients cannot spoof their IP (rate limits, audit log). If another proxy or
        # load balancer sits in front of nginx, replace $remote_addr accordingly.
        set $api_upstream http://server:8000;
        set $frontend_upstream http://frontend:80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /api/ {
            limit_req zone=api_rate burst=20 nodelay;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            # The API sets its own security headers; avoid sending them twice.
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Content-Security-Policy;
        }

        location /ws/ {
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }

        # Served by the API, not the SPA: health checks, Prometheus scrape (bearer
        # token protected by the app) and the agent install scripts.
        location = /health {
            proxy_pass $api_upstream;
        }

        location = /metrics {
            proxy_pass $api_upstream;
        }

        location ~ ^/install-agent\.(sh|ps1)$ {
            proxy_pass $api_upstream;
        }

        location / {
            proxy_pass $frontend_upstream;
        }
    }
}
