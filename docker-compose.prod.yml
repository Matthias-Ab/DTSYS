version: "3.9"

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dtsys}
      POSTGRES_USER: ${POSTGRES_USER:-dtsys}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 forces a TCP check. On first start the TimescaleDB image runs a
      # temporary server that listens only on the unix socket; a socket-only
      # pg_isready reports "healthy" while the real server is not reachable yet.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-dtsys}"]
      interval: 5s
      timeout: 5s
      retries: 10
      # First-time TimescaleDB initialization takes a minute or more; failures during
      # the start period do not count, so a slow first boot is not reported unhealthy.
      start_period: 120s

  # Scheduled database dumps into the `backups` volume. Copy them off the host
  # (e.g. `docker compose -f docker-compose.prod.yml cp backup:/backups ./backups`)
  # and test restores with scripts/restore.sh.
  backup:
    image: timescale/timescaledb:2.17.2-pg16
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dtsys}
      POSTGRES_DB: ${POSTGRES_DB:-dtsys}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    entrypoint: ["/bin/sh", "/backup-loop.sh"]
    volumes:
      - ./scripts/backup-loop.sh:/backup-loop.sh:ro
      - backups:/backups

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot schema migration. server/worker/beat wait for it to finish, so a fresh
  # database or an upgrade can never start the app against a missing/old schema.
  migrate:
    image: dtsys-server:${DTSYS_TAG:-local}
    restart: "no"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dtsys}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dtsys}
      ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
    # Retry: even with a TCP healthcheck the database can briefly restart during first-time
    # initialization. alembic is idempotent, so retrying is safe.
    command:
      - sh
      - -c
      - 'for i in $$(seq 1 30); do alembic upgrade head && exit 0; echo "migration attempt $$i failed, retrying in 3s" >&2; sleep 3; done; exit 1'

  server:
    # server is the only service that builds the application image; worker, beat and
    # migrate reuse it, so they can never run an older build than the API. Pin a
    # release with DTSYS_TAG=1.3.0 to make rollback a one-line change.
    build:
      context: ./server
      dockerfile: Dockerfile
    image: dtsys-server:${DTSYS_TAG:-local}
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dtsys}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dtsys}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY required}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:?FIRST_ADMIN_PASSWORD required}
      ENVIRONMENT: production
      ENV: production
      SCRIPTS_DIR: /opt/dtsys/scripts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    volumes:
      - ./dist:/app/dist:ro
      - ./scripts:/opt/dtsys/scripts:ro
    # The API is only reachable through nginx (expose, not ports), so trusting its
    # X-Forwarded-For is safe and gives rate limits/audit logs the real client IP.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers --forwarded-allow-ips '*'
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()\""]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    image: dtsys-server:${DTSYS_TAG:-local}
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dtsys}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dtsys}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: celery -A app.tasks.celery_app worker --loglevel=info
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -d celery@$(hostname)"]
      interval: 30s
      timeout: 10s
      retries: 3

  beat:
    image: dtsys-server:${DTSYS_TAG:-local}
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dtsys}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dtsys}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: celery -A app.tasks.celery_app beat --loglevel=info
    # beat is not a worker, so `celery inspect ping` can never succeed for it;
    # check that a celery beat process is alive instead.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys; sys.exit(0 if any(b'celery' in c and b'beat' in c for c in (open('/proc/%s/cmdline' % p,'rb').read() for p in os.listdir('/proc') if p.isdigit() and int(p) != os.getpid())) else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "test -f /usr/share/nginx/html/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - server
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  backups:
